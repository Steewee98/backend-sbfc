[phases.setup]
nixPkgs = ["python311", "glib", "pango", "cairo", "gdk-pixbuf", "gobject-introspection", "libffi", "fontconfig", "harfbuzz", "shared-mime-info"]

[phases.install]
cmds = ["python3 -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT"
